version: "3.9"

services:
  web:
    build: .
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate && daphne -b 0.0.0.0 -p 8000 ydm.asgi:application"
    volumes:
      - media_data:/app/media   # Persist media uploads
    networks:
      - coolify

networks:
  coolify:
    external: true

volumes:
  media_data:
